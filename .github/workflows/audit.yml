name: Dependency audit

# CI audits the dependencies on a push or pull request. A new advisory can appear on a quiet week with nothing pushed,
# so this checks the locked versions every Monday and fails (GitHub emails the repository owner) when one is found.
on:
  schedule:
    - cron: "30 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Audit Node dependencies
        run: npm audit --package-lock-only --audit-level=high
